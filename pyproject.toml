[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinema"
version = "0.1.2"
description = "Quality checks for LeRobot robot-learning datasets: find the data problems that kill fine-tunes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ved Patel" }]
dependencies = [
    "pyarrow>=14",
    "numpy>=1.24",
    "huggingface-hub>=0.20,<3",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/vedevpatel/kinema"
Leaderboard = "https://vedevpatel.github.io/kinema/"
Documentation = "https://github.com/vedevpatel/kinema/blob/main/docs/checks.md"
Issues = "https://github.com/vedevpatel/kinema/issues"

[project.optional-dependencies]
video = ["av>=11"]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
kinema = "kinema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinema = ["policies.json", "causes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: the codebase's style is long descriptive lines; wrapping them adds
# churn without catching bugs
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
