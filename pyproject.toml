[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# not on PyPI yet - pip installs resolve this name from a git URL (see README);
# the PyPI name is chosen at release time.
name = "kinema"
version = "0.1.0"
description = "Quality checks for LeRobot robot-learning datasets: find the data problems that kill fine-tunes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ved Patel" }]
dependencies = [
    "pyarrow>=14",
    "numpy>=1.24",
    "huggingface-hub>=0.20",
    "rich>=13",
]

[project.optional-dependencies]
video = ["av>=11"]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
kinema = "kinema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: the codebase's style is long descriptive lines; wrapping them adds
# churn without catching bugs
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
