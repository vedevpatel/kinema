[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# kinema is a placeholder: the public name is chosen at release time.
name = "kinema"
version = "0.1.0"
description = "Quality checks for LeRobot robot-learning datasets: find the data problems that kill fine-tunes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ved Patel" }]
dependencies = [
    "pyarrow>=14",
    "numpy>=1.24",
    "huggingface-hub>=0.20",
    "rich>=13",
]

[project.optional-dependencies]
video = ["av>=11"]
dev = ["pytest>=7"]

[project.scripts]
kinema = "kinema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
