name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev,video]
      # every unit suite, including the false-positive regressions; the
      # network suites skip themselves without KINEMA_E2E
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check src scripts tests
      - run: mypy src/kinema

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # v2 started failing with "missing gitleaks license" on this personal
      # repo between two same-day runs (the floating tag moved); v3 is
      # upstream's current action and needs no license for personal accounts
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  end-to-end:
    # real dataset, real Hub traffic; nightly + on demand, not every PR
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      # pusht end-to-end + the real-data guard (pinned Hub revisions: known-
      # healthy datasets must not FAIL, known defects must still be caught)
      # + the sensitivity guard: injected defects on pinned datasets must be
      # caught, untouched data must not grow flags (scripts/calibrate.py --quick)
      - run: KINEMA_E2E=1 python -m pytest tests/test_end_to_end.py tests/test_real_datasets.py tests/test_sensitivity.py -q
