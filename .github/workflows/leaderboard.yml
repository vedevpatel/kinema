name: leaderboard

on:
  schedule:
    - cron: "43 10 * * *"  # nightly, ~02:43 PT
  workflow_dispatch:
    inputs:
      full:
        description: "Re-audit every dataset from scratch, ignoring resume state"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: clear resume state for a full re-audit
        if: ${{ inputs.full }}
        run: rm -f docs/data.json
      - run: pip install -e .[video] hf_transfer
      # continue-on-error so partial results still commit (resume reads
      # data.json), then the final step turns the run red: a crashed audit
      # must never look green again (the old || true masked exactly this).
      - name: audit
        id: audit
        continue-on-error: true
        run: timeout 3300 env HF_HUB_ENABLE_HF_TRANSFER=1 HF_TOKEN=${{ secrets.HF_TOKEN }} python scripts/leaderboard.py --limit 200 --max-episodes 250 --workers 8 --time-budget 3000 --out docs
      - name: commit site
        if: always()
        run: |
          git config user.name "Ved Patel"
          git config user.email "130187703+vedevpatel@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "leaderboard: nightly audit"
          git push
      - name: fail the run if the audit crashed
        if: steps.audit.outcome == 'failure'
        run: exit 1
