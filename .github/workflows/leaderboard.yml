name: leaderboard

on:
  schedule:
    - cron: "43 10 * * *"  # nightly, ~02:43 PT
  workflow_dispatch:
    inputs:
      full:
        description: "Re-audit every dataset from scratch, ignoring resume state"
        type: boolean
        default: false

permissions:
  contents: write

# one board writer at a time: the weekly discovery job shares this group, and
# a second audit queues instead of racing the first one's push
concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: clear resume state for a full re-audit
        if: ${{ inputs.full }}
        run: rm -f docs/data.json
      - run: pip install -e .[video] hf_transfer
      # continue-on-error so partial results still commit (resume reads
      # data.json), then the final step turns the run red: a crashed audit
      # must never look green again (the old || true masked exactly this).
      - name: audit
        id: audit
        continue-on-error: true
        # discovery is the weekly leaderboard-discover job's work; the nightly
        # reads its worklist and only rediscovers when it is >14 days old.
        # time-budget stops new audits at 40 min; hard-deadline abandons
        # in-flight ones at 50 min, well inside the 55 min shell timeout.
        # Memory: 8 workers x a 512 MiB frame budget per load stays well under
        # the runner's RAM (16 workers x 1 GiB plus video decode killed the
        # runner mid-run and lost every audit of that run).
        # Checkpoints: a killed runner skips every later step, so the board is
        # pushed every 10 minutes from a separate worktree - only the generated
        # board files (data.json, index.html, dataset/), never hand-edited docs.
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KINEMA_FRAME_BUDGET_BYTES: "536870912"
        run: |
          git config --global user.name "Ved Patel"
          git config --global user.email "130187703+vedevpatel@users.noreply.github.com"
          checkpoint() {
            rm -rf /tmp/ckpt
            git fetch -q origin main && git worktree add -q -f /tmp/ckpt origin/main || return 1
            mkdir -p /tmp/ckpt/docs/dataset
            cp docs/data.json docs/index.html /tmp/ckpt/docs/ 2>/dev/null
            cp -R docs/dataset/. /tmp/ckpt/docs/dataset/ 2>/dev/null
            (
              cd /tmp/ckpt || exit 1
              git add docs/data.json docs/index.html docs/dataset
              git diff --cached --quiet && exit 0
              git commit -q -m "leaderboard: audit checkpoint"
              for attempt in 1 2 3; do
                git push -q origin HEAD:main && exit 0
                git pull -q --rebase -X theirs origin main || git rebase --abort
                sleep 10
              done
              exit 1
            )
            rc=$?
            git worktree remove -f /tmp/ckpt
            return $rc
          }
          timeout 3300 python scripts/leaderboard.py --limit 200 --max-episodes 250 --workers 8 \
            --worklist docs/worklist.json --worklist-max-age-hours 336 \
            --time-budget 2400 --hard-deadline 3000 --out docs &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for i in $(seq 60); do
              kill -0 "$pid" 2>/dev/null || break
              # memory trail: a killed runner leaves no other evidence
              [ $((i % 6)) -eq 0 ] && echo "mem: $(free -m | awk '/Mem:/ {print $3 " MB used, " $7 " MB available"}')"
              sleep 10
            done
            kill -0 "$pid" 2>/dev/null && { checkpoint && echo "checkpoint pushed" || echo "checkpoint failed"; }
          done
          wait "$pid"
      - name: keep the audit results even if the push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-${{ github.run_id }}
          path: |
            docs/data.json
            docs/worklist.json
          if-no-files-found: ignore
          retention-days: 14
      - name: commit site
        if: always()
        run: |
          git config user.name "Ved Patel"
          git config user.email "130187703+vedevpatel@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "leaderboard: nightly audit"
          # main moves while a 55-minute audit runs: rebase onto it and retry.
          # -X theirs keeps this run's board files if both sides touched them.
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "could not push after 5 attempts - results are in the run artifact"
          exit 1
      - name: fail the run if the audit crashed
        if: steps.audit.outcome == 'failure'
        run: exit 1
