name: leaderboard

on:
  schedule:
    - cron: "43 10 * * *"  # nightly, ~02:43 PT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . hf_transfer
      - run: timeout 3300 env HF_HUB_ENABLE_HF_TRANSFER=1 HF_TOKEN=${{ secrets.HF_TOKEN }} python scripts/leaderboard.py --limit 200 --workers 8 --time-budget 3000 --out docs || true
      - name: commit site
        if: always()
        run: |
          git config user.name "Ved Patel"
          git config user.email "130187703+vedevpatel@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "leaderboard: nightly audit"
          git push
